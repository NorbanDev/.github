name: Bug
description: Something is broken or behaves wrongly.
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        **Title:** the symptom and where it happens, 60 characters or less. No `[Bug]` prefix; this form sets the type.
        Rules and examples: [ISSUES.md](https://github.com/NorbanDev/.github/blob/main/ISSUES.md)
  - type: textarea
    id: in_short
    attributes:
      label: In short
      description: 2 or 3 sentences, 60 words at most, that anyone on the team understands. Use product words, not code names or file paths.
      placeholder: Säljare who remove their bostad see the wrong banner in Inkorg. It says the bostad changed owner, so they think someone took it over.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: How it goes wrong, in plain steps. File paths and code names go after the plain sentence, and evidence goes under Context.
      placeholder: Säljare who remove their bostad see "Bostaden har bytt ägare" in the Inkorg banner.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision or blocker
      description: Anything that must be decided or finished before work starts. Leave empty if none.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered and exact. Name the environment, user and page.
      placeholder: |
        1. On development, sign in as a säljare with a listed bostad
        2. Remove the bostad from Min bostad
        3. Open Inkorg
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead. Put errors in a code block, and link long logs.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 3–7 checks anyone can run to confirm the fix. Say where to check.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Where it lives (repo area, files, environment), evidence, and the commit or date it was measured at.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What must not change while fixing this.
