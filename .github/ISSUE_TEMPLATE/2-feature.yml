name: Feature
description: Users or the team need something the product does not do.
type: Feature
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        **Title:** the outcome, in the imperative, 60 characters or less. No `[Feature]` prefix; this form sets the type.
        Rules and examples: [ISSUES.md](https://github.com/NorbanDev/.github/blob/main/ISSUES.md)
  - type: textarea
    id: in_short
    attributes:
      label: In short
      description: 2 or 3 sentences, 60 words at most, that anyone on the team understands. Use product words, not code names or file paths.
      placeholder: Ops cannot find an archived lead from the Backoffice chat list, so they lose track of past contacts.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What users or the team cannot do today, why it matters now, and how it works today. Evidence goes under Context.
      placeholder: When a lead is archived, its link disappears from the Backoffice chat list, so ops lose track of past contacts.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision or blocker
      description: Anything that must be decided or finished before work starts. Leave empty if none.
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What to build, if you know. Leave empty when the solution still needs design.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 3–7 checks anyone can run. Say where to check.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Who asked, links, screenshots, and the commit or date any numbers were measured at.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
