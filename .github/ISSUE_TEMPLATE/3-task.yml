name: Task
description: Engineering work with no user-visible change, such as a refactor, dependency, infrastructure, CI or docs.
type: Task
body:
  - type: markdown
    attributes:
      value: |
        **Title:** the outcome, in the imperative, 60 characters or less. No `[Chore]` prefix; this form sets the type.
        Rules and examples: [ISSUES.md](https://github.com/NorbanDev/.github/blob/main/ISSUES.md)
  - type: textarea
    id: in_short
    attributes:
      label: In short
      description: 2 or 3 sentences, 60 words at most, that anyone on the team understands. Use product words, not code names or file paths.
      placeholder: The code still uses old Apollo cache calls. We finish the rename now, so the next release can remove them. Users see no change.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What changes and why. Say whether it needs an infrastructure change.
      placeholder: Finish the Apollo Client 4 API renames, so the deprecated cache calls can be removed in the next release.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Decision or blocker
      description: Anything that must be decided or finished before work starts. Leave empty if none.
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: 3–7 checks anyone can run. Say where to check.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk and rollback
      description: What can break, and how to undo it. Required for infrastructure, data and migration changes. Name the environments.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Files, resources, links, and the commit or date any numbers were measured at.
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
